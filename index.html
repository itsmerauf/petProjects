<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <div class="coverPage" hidden>
  <h1 class="welcomeTxt">Welcome Player!</h1>
  <button class="startBtn">▶</button>
  <h2>Shall We?</h2>
</div>
    <div class="scoreBoard">
        <p class="player"></p>
    <div class="score">
        <p class="userScore">0</p>
        <p>:</p>
        <p class="computerScore">0</p>
    </div>
        <p class="computer">Computer</p>
    </div>

    <div class="gameboard">
        <p class="userChoice">-</p>
        <h1 class="gameResultMsg"></h1>
        <p class="computerChoice">-</p>
    </div>

    <div class="choiceBtns">
        <button class="rock">Rock</button>
        <button class="paper">Paper</button>
        <button class="scissors">Scissors</button>
        <button class="resetBtn">Reset</button>
    </div>
  </body>
</html>
